name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: python -m pytest -q
      - run: python -m compileall -q custom_components
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: boiler-flow-control
          path: dist/*
